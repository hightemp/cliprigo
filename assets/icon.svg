<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7bff"/>
      <stop offset="1" stop-color="#2741c7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Tile with margin, as desktop icon grids expect. -->
  <rect x="80" y="80" width="864" height="864" rx="196" fill="url(#bg)"/>
  <rect x="80" y="80" width="864" height="864" rx="196" fill="url(#shine)"/>
  <!-- A "play" triangle turned downwards: video + download in one shape. -->
  <path d="M338 300 H686 L512 590 Z" fill="#fff" stroke="#fff" stroke-width="72" stroke-linejoin="round"/>
  <!-- Tray. -->
  <path d="M312 650 V700 Q312 744 356 744 H668 Q712 744 712 700 V650" fill="none" stroke="#fff" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
