name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux deps
        timeout-minutes: 16
        run: |
          # A mirror sometimes stalls without failing: time out and try again.
          apt="sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for attempt in 1 2 3; do
            $apt update && $apt install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf && exit 0
            echo "apt attempt $attempt failed"
          done
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - name: UI scenarios
        run: pnpm ui:preview ui-preview
      - name: Upload UI screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: ui-preview
      - working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Checksums of all platforms' components
        working-directory: src-tauri
        run: cargo test checksums_for_all_platforms -- --ignored

  # Real yt-dlp, ffmpeg and Deno against real YouTube on every OS: install the
  # components, probe, download, cancel. Each step has a timeout, so a hang fails.
  live:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: live
      - name: Install Linux deps
        timeout-minutes: 16
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          # A mirror sometimes stalls without failing: time out and try again.
          apt="sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for attempt in 1 2 3; do
            $apt update && $apt install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf && exit 0
            echo "apt attempt $attempt failed"
          done
          exit 1
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! embeds the built frontend.
      - run: pnpm build
      - name: Live tests against YouTube
        working-directory: src-tauri
        run: cargo test live_ -- --ignored --test-threads=1 --nocapture

  bundle:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
          - platform: windows-11-arm
            args: ""
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux deps
        timeout-minutes: 16
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          # A mirror sometimes stalls without failing: time out and try again.
          apt="sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for attempt in 1 2 3; do
            $apt update && $apt install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf && exit 0
            echo "apt attempt $attempt failed"
          done
          exit 1
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Cliprigo ${{ github.ref_name }}"
          releaseDraft: true

  # APKs for phones (arm64) and older phones (armv7). Signed when the ANDROID_KEYSTORE
  # secrets are set; a tag attaches them to the release that `bundle` drafts.
  android:
    needs: lint
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;28.0.12433566"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
      - run: pnpm install --frozen-lockfile
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE != ''
        working-directory: src-tauri/gen/android
        run: |
          echo "$KEYSTORE" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "keyAlias=cliprigo"
            echo "password=$KEYSTORE_PASSWORD"
          } > keystore.properties
      - name: Build APKs
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.12433566
        run: pnpm tauri android build --apk --split-per-abi --target aarch64 armv7
      - name: Collect APKs
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir dist-android
          out=src-tauri/gen/android/app/build/outputs/apk
          cp $out/arm64/release/*.apk "dist-android/Cliprigo_${version}_android_arm64.apk"
          cp $out/arm/release/*.apk "dist-android/Cliprigo_${version}_android_armv7.apk"
          ls -la dist-android
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist-android
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') && hashFiles('src-tauri/gen/android/keystore.properties') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist-android/*.apk --clobber
