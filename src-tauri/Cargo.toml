[package]
name = "cliprigo"
version = "0.1.4"
description = "YouTube downloader with history, powered by yt-dlp"
authors = ["hightemp"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cliprigo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.3"
tokio = { version = "1.54.0", features = ["full", "process"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
thiserror = "2.0.21"
sha2 = "0.11.1"
hex = "0.4.3"
zip = "9.0.5"
futures-util = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2", "socks"] }
md-5 = "0.11.0"
url = "2.5.8"
tokio-util = "0.7.20"
tauri-plugin-clipboard-manager = "2.5.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["test-util", "macros", "rt-multi-thread"] }
